services:
  - type: web
    name: nova-geo-cashbook
    runtime: docker
    plan: starter          # always-on (~$7/mo). Use "free" only with an uptime pinger, see README
    region: singapore      # closest Render region to India
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DASHBOARD_KEY
        generateValue: true
